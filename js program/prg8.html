<html>
<body>
<script>
const students = [
    { name: "A", marks: 85, course: "BCA" },
    { name: "B", marks: 45, course: "BCA" },
    { name: "C", marks: 72, course: "BSc" },
    { name: "D", marks: 91, course: "BSc" },
    { name: "E", marks: 38, course: "BCA" }
];

// 1. Students scoring more than 50
const selectedStudents = students.filter
(
    student => student.marks > 50
);

// 2. Extract student names
const studentNames = selectedStudents.map
(
    student => student.name
);

// 3. Calculate total marks
const totalMarks = students.reduce
(
    (total, student) => total + student.marks,
    0
);

// 4 & 5. Destructuring and template literals
console.log("Students scoring more than 50:");

for (const { name, marks, course } of selectedStudents) 
{
    console.log(
        `Name: ${name}, Marks: ${marks}, Course: ${course}`
    );
}

// 6. Unique courses using Set
const uniqueCourses = new Set
(
    students.map(student => student.course)
);

console.log(`Student Names: ${studentNames.join(", ")}`);
console.log(`Total Marks: ${totalMarks}`);
console.log(`Unique Courses: ${[...uniqueCourses].join(", ")}`);

// 7. Iterate through all students using for-of
console.log("All Students:");

for (const student of students) 
{
    console.log
    (
        `${student.name} - ${student.marks} - ${student.course}`
    );
}
</script>
</body>
</html>
